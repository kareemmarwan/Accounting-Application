<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>غير متصل — المساعد المالي</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #1e293b;
      font-family: "Cairo", system-ui, sans-serif;
      text-align: center;
    }
    .box { padding: 2rem; max-width: 24rem; }
    .icon {
      width: 4rem; height: 4rem; margin: 0 auto 1.5rem;
      border-radius: 1.25rem; background: #16a34a;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: #fff;
    }
    h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
    p { color: #64748b; line-height: 1.8; margin: 0; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">&#8377;</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تعذّر تحميل هذه الصفحة الآن. العمليات المسجلة مسبقاً محفوظة على جهازك وستُزامن تلقائياً عند عودة الاتصال.</p>
  </div>
</body>
</html>
